version: "3.9"

# ============================================================
# SMC Sudan MOBA Community - Development Docker Compose
# Only infrastructure services (DB, Redis)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: smc_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: smc_user
      POSTGRES_PASSWORD: smc_password
      POSTGRES_DB: smc_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smc_user -d smc_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smc_redis_dev
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Commander - Web UI for Redis inspection
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smc_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_dev_data:
    driver: local
